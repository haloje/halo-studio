name: App web bundle

# Packs the published Studio into a zip the iPhone app downloads in the background,
# so the app runs from its own copy (instant, works offline) and still picks up every change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

concurrency:
  group: web-bundle
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('docs/app/version.json'))['version'])")
          SUM=$(python3 tools/bundle.py "studio-$VER.zip")
          WANT=$(python3 -c "import json;print(json.load(open('docs/app/latest.json'))['checksum'])")
          [ "$SUM" = "$WANT" ] || { echo "::error::Bundle checksum $SUM does not match latest.json $WANT. Run tools/build.py and commit."; exit 1; }
          gh release view web-bundle >/dev/null 2>&1 || gh release create web-bundle --title "App web bundle" --notes "Studio web files for the iPhone app. Updated automatically." --latest=false
          gh release upload web-bundle "studio-$VER.zip" --clobber
          # Keep the five newest bundles. The website's version.json is cached for a few minutes after
          # each push, so a phone can still ask for the previous zip; deleting it straight away broke updates.
          for a in $(gh api "repos/${{ github.repository }}/releases/tags/web-bundle" -q '.assets | sort_by(.updated_at) | reverse | .[5:] | .[].name'); do gh release delete-asset web-bundle "$a" -y; done
          ls -la "studio-$VER.zip"

let jxSigDirty = false;
function jxAfterRender(){
  const c = $("#jxSig"); if(!c) return; jxSigDirty = false;
  const r = c.getBoundingClientRect(), dpr = Math.max(1, devicePixelRatio || 1); c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const x = c.getContext("2d"); x.scale(dpr, dpr); x.lineWidth = 2.2; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#141210";
  let down = false, lx = 0, ly = 0;
  const pt = ev=>{ const b = c.getBoundingClientRect(); return [ev.clientX - b.left, ev.clientY - b.top]; };
  c.onpointerdown = ev=>{ down = true; c.setPointerCapture(ev.pointerId); [lx, ly] = pt(ev); x.beginPath(); x.arc(lx, ly, 1, 0, 7); x.fillStyle = "#141210"; x.fill(); jxSigDirty = true; };
  c.onpointermove = ev=>{ if(!down) return; const [nx, ny] = pt(ev); x.beginPath(); x.moveTo(lx, ly); x.lineTo(nx, ny); x.stroke(); lx = nx; ly = ny; jxSigDirty = true; };
  c.onpointerup = c.onpointercancel = ()=>{ down = false; };
}

function rpRange(){ const n = new Date(), y = n.getFullYear(), m = n.getMonth();

let aiCtl = null;
function aiCandidates(notes){
  const words = [...new Set(notes.toLowerCase().replace(/[^a-z0-9\-\+ ]/g, " ").split(/\s+/).filter(w=>(w.length > 2 || /\d/.test(w)) && !/^(the|and|for|with|from|this|that|into|need|needs|want|wants|room|rooms|house|plus|also|each|some|about|install|supply|fit|new|two|three|four|five|six|one)$/.test(w)))];
  const seen = new Map();
  const add = pr=>{ if(!seen.has(pr.id) && seen.size < 150) seen.set(pr.id, pr); };
  for(let k = 0; k < words.length; k++){ searchProducts(words[k], 6).forEach(add); if(words[k+1]) searchProducts(words[k] + " " + words[k+1], 6).forEach(add); }
  return [...seen.values()];
}
function aiClientCands(notes){
  const n = notes.toLowerCase(), out = [];
  clients.forEach(c=>{ const parts = [c.name, c.company].filter(Boolean); let score = 0;
    parts.forEach(p=>{ const t = String(p).toLowerCase().replace(/^jsy-?\d+\s*-?\s*/, ""); if(t.length > 3 && n.includes(t)) score += 10; t.split(/\s+/).filter(w=>w.length > 3).forEach(w=>{ if(n.includes(w)) score += 2; }); });
    sitesOf(c).forEach(a=>{ String(a).toLowerCase().split(/,\s*/).forEach(seg=>{ if(seg.length > 5 && n.includes(seg)) score += 4; }); });
    if(score >= 4) out.push([score, c]); });
  return out.sort((a,b)=>b[0]-a[0]).slice(0, 6).map(x=>x[1]);
}
function aiPrompt(notes){
  const lib = aiCandidates(notes).map(p=>({ id: p.id, item: p.item, model: p.model || "", price: num(p.price) || 0, supplier: p.supplier || "" }));
  const cl = aiClientCands(notes).map(c=>({ id: c.id, name: c.name, company: c.company || "", contact: c.contact || "", sites: sitesOf(c).slice(0, 3) }));
  return `You are drafting a customer proposal for halo.je, a smart home, AV and networking installer in Jersey run by Ian Lamont. Turn Ian's notes into a structured proposal.

House style: British English, first person singular ("I"), plain and confident, no hype, no exclamation marks. Prices are sell prices in GBP. No GST is charged. Labour rate is £${current && num(current.rate) || 85}/hour.

Rules:
- Group equipment into systems (e.g. "Wi-Fi & network", "CCTV", "Door entry", "Multi-room audio", "Lighting control", "TV & AV"). Use only systems the notes need.
- For each piece of equipment, if a product in LIBRARY matches, set "libId" to its id and copy its item and model. Do not change library prices; set "price" to the library price. If no library product fits, set "libId" to null, write a sensible item name, and set "price" to your best estimate of a UK trade-plus-margin sell price, with "tag": "Provisional". If you cannot estimate, use price 0 and tag "Allowance".
- Quantities from the notes. If the notes give labour as days, convert to hours at 8 hours per day and spread hours across systems sensibly. If no labour is given, estimate realistic install and programming hours per system.
- "work" is a list of short lines describing the installation work for that system.
- "scopeStages" is 4 to 6 lines, each "Title: what happens".
- "next" lists open questions Ian should ask the customer, if any.
- If a CUSTOMER candidate clearly matches the notes, set "clientId" to its id and use its name and first site. Otherwise clientId null and take names and site from the notes.
- If the notes mention a deposit percentage, set "depositPct".

LIBRARY (candidate products from Ian's price list):
${JSON.stringify(lib)}

CUSTOMER candidates:
${JSON.stringify(cl)}

IAN'S NOTES:
${notes}

Reply with only one JSON object in exactly this shape:
{"clientId": null, "preparedFor": "", "client": "", "site": "", "titleA": "Short project title", "titleB": "second line, lower case, ending with a full stop.", "lede": "One or two sentences on what the customer gets.", "intro": "Two short paragraphs separated by a blank line.", "systems": [{"name": "", "desc": "", "hours": 0, "work": [""], "items": [{"libId": null, "qty": 1, "item": "", "model": "", "price": 0, "tag": ""}]}], "scopeStages": [""], "next": [""], "depositPct": null}`;
}
function aiApply(d){
  createNew();
  const p = current, c = d.clientId && clientById(String(d.clientId));
  if(c){ p.clientId = c.id; p.preparedFor = c.company || c.name; p.client = d.client || c.contact || ""; p.site = sitesOf(c)[0] || d.site || p.site; p.signedFor = c.name; }
  else { if(d.preparedFor) p.preparedFor = String(d.preparedFor); if(d.client) p.client = String(d.client); if(d.site) p.site = String(d.site); p.signedFor = p.preparedFor; }
  ["titleA","titleB","lede","intro"].forEach(k=>{ if(d[k]) p[k] = String(d[k]); });
  const sys = Array.isArray(d.systems) ? d.systems : [];
  if(sys.length) p.systems = sys.map(s=>({ name: String(s.name || "System"), desc: String(s.desc || ""), hours: num(s.hours), work: (Array.isArray(s.work) ? s.work : [s.work]).filter(Boolean).map(String).join("\n"),
    items: (Array.isArray(s.items) ? s.items : []).map(it=>{ const pr = it.libId && products.find(x=>x.id === String(it.libId));
      return pr ? Object.assign(newItem(), { qty: num(it.qty) || 1, item: pr.item, model: pr.model || "", price: num(pr.price), desc: pr.desc || "", img: pr.img || "", libId: pr.id, tag: num(pr.price) ? "" : "Provisional" })
                : Object.assign(newItem(), { qty: num(it.qty) || 1, item: String(it.item || ""), model: String(it.model || ""), price: num(it.price), tag: ["Allowance","Provisional"].includes(it.tag) ? it.tag : (num(it.price) ? "Provisional" : "Allowance") }); }).filter(it=>it.item) }));
  if(Array.isArray(d.scopeStages) && d.scopeStages.filter(Boolean).length) p.scopeStages = d.scopeStages.filter(Boolean).map(String).join("\n");
  if(Array.isArray(d.next)) p.next = d.next.filter(Boolean).map(String).join("\n");

}

async function prSync(ids){

  let done = 0, failed = 0;
  for(let k = 0; k < items.length; k += 25){
    const chunk = items.slice(k, k + 25); prSetStatus(`Updating Xero… ${done + failed} of ${items.length}`);
    try{ await prCall(m, chunk.map(prLine)); for(const it of chunk){ await prWrite(it.id, { xs: { price: num(it.price), at: jbToday() }, xdirty: false, xerr: "", xero: Object.assign({}, it.xero, { code: prLine(it).item_code, name: prLine(it).item_name }) }); done++; } }

      for(const it of chunk){ /* isolate the item Xero refused */

  prBusy = false; prSetStatus(failed ? `${done} updated in Xero, ${failed} not. Hover the red items for why.` : `${done} item${done===1?"":"s"} updated in Xero just now.`, !!failed); prRender();
}

/* import a price file: Xero inventory export, Tradify export, or any CSV with code + price columns */
function prParseCsv(text){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < text.length; i++){ const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; continue; }
    if(c === '"') q = true; else if(c === ","){ row.push(f); f = ""; } else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; } else f += c; }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
$("#prImport").addEventListener("change", async e=>{
  const file = e.target.files && e.target.files[0]; e.target.value = ""; if(!file) return;
  const rows = prParseCsv((await file.text()).replace(/^﻿/, "")); if(rows.length < 2){ toast("That file has no rows."); return; }
  const H = rows[0].map(h=>h.replace(/^\*/, "").trim().toLowerCase());
  const col = (...names)=>{ for(const n of names){ const k = H.findIndex(h=>h === n); if(k >= 0) return k; } for(const n of names){ const k = H.findIndex(h=>h.includes(n)); if(k >= 0) return k; } return -1; };
  const cCode = col("itemcode", "item code", "code", "sku", "part number", "model"), cPrice = col("salesunitprice", "sell price", "unit price", "price", "sale price"), cName = col("salesdescription", "item name", "itemname", "name", "description"), cSup = col("supplier");
  if(cCode < 0 || cPrice < 0){ toast("Couldn't find a code and a price column in that file."); return; }
  const norm = s=>String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const byCode = new Map(); products.forEach(p=>{ [p.model, p.xero && p.xero.code].filter(Boolean).forEach(c=>{ if(!byCode.has(norm(c))) byCode.set(norm(c), p); }); });
  let upd = 0, add = 0, same = 0;
  for(const r of rows.slice(1)){
    const code = (r[cCode] || "").trim(), price = Math.round(num(String(r[cPrice] || "").replace(/[£,\s]/g, "")) * 100) / 100, name = cName >= 0 ? (r[cName] || "").trim() : "";
    if(!code) continue;
    const it = byCode.get(norm(code)) || byCode.get(norm("HA-" + code));
    if(it){ if(price && Math.abs(num(it.price) - price) > 0.004){ await prWrite(it.id, { price }); if(it.xero) prQueue.add(it.id); upd++; } else same++; }
    else if(name || price){ const id = "p-" + norm(code).toLowerCase().slice(0, 40) + "-" + Date.now().toString(36).slice(-4); await prWrite(id, { id, item: name || code, model: code, price, supplier: cSup >= 0 ? (r[cSup] || "").trim() : "", category: "" }); add++; }
  }
  prRender(); toast(`Price file imported: ${upd} price${upd===1?"":"s"} updated, ${add} new item${add===1?"":"s"}, ${same} unchanged.`);
  if(prAuto && prQueue.size) prSync([...prQueue]);
});

const MG_COLLECTIONS = ["proposals", "jobs", "drawings", "clients", "products", "settings", "catalog", "kb"];
async function mgExport(btn){
  if(mode !== "db"){ toast("Open Studio in claude.ai to export."); return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Collecting…";
  try{
    const out = { app: "halo.je Studio", kind: "migration", exported: new Date().toISOString(), collections: {}, assets: {} };
    for(const c of MG_COLLECTIONS){ const sn = await db.collection(c).get(); out.collections[c] = sn.docs.map(d=>({ id: d.id, data: d.data() })); }
    const text = JSON.stringify(out.collections), ids = [...new Set((text.match(/\/_blob\/[A-Za-z0-9_-]+/g) || []))];
    let n = 0;
    for(const u of ids){ btn.textContent = `Copying files ${++n} of ${ids.length}…`;
      try{ const b = await (await fetch(u)).blob(); out.assets[u] = await new Promise((res, rej)=>{ const f = new FileReader(); f.onload = ()=>res(f.result); f.onerror = rej; f.readAsDataURL(b); }); }catch(_){ } }
    await offer(`halo.je Studio move ${jbToday()}.json`, JSON.stringify(out));
    toast(`Export ready: ${Object.values(out.collections).reduce((a,x)=>a + x.length, 0)} records and ${Object.keys(out.assets).length} files.`);
  }catch(e){ console.error(e); toast("The export couldn't be made."); }
  btn.disabled = false; btn.textContent = label;
}
document.addEventListener("change", async e=>{

  else if(fmt === "ul") prefix(x=>"- " + x);
  else if(fmt === "chk") prefix(x=>"- [ ] " + x);
  else if(fmt === "ol") { let n = 0; prefix(x=>`${++n}. ` + x); }
  else if(fmt === "b"){ ta.setRangeText(`**${sel || "bold"}**`, s, e, "select"); }
  else if(fmt === "code"){ ta.setRangeText(sel.includes("\n") || !sel ? "\n```\n" + (sel || "paste code here") + "\n```\n" : "`" + sel + "`", s, e, "select"); }
  else if(fmt === "link"){ const u = prompt("Web address", "https://"); if(!u) return; ta.setRangeText(`[${sel || "link"}](${u.trim()})`, s, e, "end"); }
  ta.focus(); kbCur.body = ta.value; kbSchedule();
}
async function kbAddFiles(files){
  const a = await getAssets(); if(!a){ toast("Files can't be added here."); return; }
  kbSetStatus("Uploading…");
  for(const f of files){
    try{
      if(/^image\//.test(f.type) && !/svg/.test(f.type)){
        const { blob } = await shrink(f, 2000, "image/jpeg", 0.86); const url = (await a.upload(blob)).url;
        const ta = $("#kbBody"), md = `\n![${f.name.replace(/\.[^.]+$/, "").replace(/[\[\]]/g, "")}](${url})\n`;
        if(ta){ ta.setRangeText(md, ta.selectionStart, ta.selectionEnd, "end"); kbCur.body = ta.value; } else kbCur.body += md;
      } else {
        const url = (await a.upload(f)).url; kbCur.files = (kbCur.files || []).concat([{ name: f.name, url, type: f.type || "" }]);
      }
    }catch(e){ toast(`Couldn't upload ${f.name}.`); }
  }
  kbSchedule(); await kbFlush(); kbRender();
}
$("#kbChips").addEventListener("click", e=>{ const b = e.target.closest("[data-kf]"); if(b){ kbCat = b.dataset.kf; kbRenderList(); } });
$("#kbSearch").addEventListener("input", e=>{ kbQ = e.target.value; kbRenderList(); });
$("#kbRows").addEventListener("click", async e=>{ const b = e.target.closest("[data-kb]"); if(b){ await kbFlush(); kbOpen(b.dataset.kb, false); } });
$("#kbNew").addEventListener("click", ()=>kbNew());
$("#kbScroll").addEventListener("input", e=>{
  const k = e.target.dataset.kk; if(!k || !kbCur) return;
  kbCur[k] = e.target.value; if(k === "title"){ const h = $("#kbScroll .jhead h2"); if(h) h.textContent = e.target.value || "New article"; }
  kbSchedule();
});
$("#kbScroll").addEventListener("change", e=>{
  if(e.target.dataset.kfile){ const fs = [...e.target.files]; e.target.value = ""; if(fs.length) kbAddFiles(fs); return; }
  if(e.target.dataset.kk && e.target.tagName === "SELECT"){ kbCur[e.target.dataset.kk] = e.target.value; kbSchedule(); }
  const c = e.target.dataset.kbchk; if(c != null && kbCur){ const L = kbCur.body.split("\n"), n = +c; if(L[n] != null){ L[n] = L[n].replace(/\[( |x|X)\]/, e.target.checked ? "[x]" : "[ ]"); kbCur.body = L.join("\n"); kbSchedule(); } }
});
$("#kbScroll").addEventListener("click", async e=>{
  const f = e.target.closest("[data-kfmt]"); if(f){ e.preventDefault(); kbWrap(f.dataset.kfmt); return; }
  const b = e.target.closest("[data-kact]"); if(!b) return; e.preventDefault();
  const act = b.dataset.kact;
  if(act === "new") return kbNew();
  if(act === "open") return kbOpen(b.dataset.id, false);
  if(!kbCur) return;
  if(act === "edit"){ kbEditing = true; kbRender(); }
  else if(act === "done"){ if(!String(kbCur.title || "").trim()){ kbCur.title = kbPlain(kbCur.body).slice(0, 60) || "Untitled"; kbDirty = true; } await kbFlush(); kbEditing = false; kbRender(); }
  else if(act === "pin"){ kbCur.pinned = !kbCur.pinned; kbDirty = true; await kbFlush(); kbRender(); }
  else if(act === "client"){ await kbFlush(); setTab("customers"); cuOpen(kbCur.clientId); }
  else if(act === "rmFile"){ kbCur.files.splice(+b.dataset.i, 1); kbSchedule(); kbRender(); }
  else if(act === "remove"){
    const gone = clone(kbCur); clearTimeout(kbT); kbDirty = false;
    kbList = kbList.filter(x=>x.id !== gone.id); kbCur = null; kbSel = null; kbEditing = false; kbRenderList(); kbRender(); if(innerWidth <= 860) setView("edit");
    if(mode === "db"){ try{ await db.collection("kb").doc(gone.id).delete(); }catch(_){ toast("Couldn't delete it."); } } else { try{ localStorage.setItem(LS + ".kb", JSON.stringify(kbList)); }catch(_){} }
    undoToast(`"${gone.title || "Untitled"}" deleted.`, async ()=>{ kbList.unshift(gone); await kbWrite(gone); kbRenderList(); kbOpen(gone.id, false); }, null);
  }
});
/* Customer page: articles linked to this customer. */
function kbClientCard(c){
  if(!c || !c.id) return "";
  const arts = kbList.filter(a=>a.clientId === c.id).sort((p,q)=>q.updated - p.updated);
  return `<div class="jcard"><h3>Site knowledge <small>${arts.length}</small></h3>
    ${arts.length ? `<div class="culink">${arts.map(a=>`<button data-ca="openKb" data-id="${esc(a.id)}"><span class="n">${esc(kbCatName(a.cat))}</span><span>${esc(a.title || "Untitled")}<small>${esc(kbSnippet(a, []).slice(0, 70))}</small></span></button>`).join("")}</div>` : `<p class="note">Nothing yet. Keep network details, equipment lists, programming notes and quirks for this site here.</p>`}
    <div class="adds"><button class="btn small" data-ca="newKb">New article for ${esc(c.name || "this customer")}</button></div></div>`;
}

</script>

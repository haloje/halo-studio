@font-face{font-family:"Outfit";font-weight:300;font-display:swap;src:url(fonts/outfit-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:400;font-display:swap;src:url(fonts/outfit-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:400;font-display:swap;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:500;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:600;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:700;font-display:swap;src:url(fonts/hanken-grotesk-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-weight:400;font-display:swap;src:url(fonts/geist-mono-latin-400-normal.woff2) format("woff2")}

<style>
/* Layout: working editor on the left, the printed proposal on a stage to the right; stacked with a toggle on phones. */
:root{
  --bg:#f2f0ec; --panel:#fbfaf8; --ink:#1c1a17; --muted:#6e675e; --line:#e1dcd3; --field:#ffffff;
  --accent:#9a5f1f; --accent-soft:#f3e7d6; --gold:#e8b878; --stage:#dcd7ce; --danger:#a63d2a;
  --f-display:"Outfit","Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141311; --panel:#1c1a18; --ink:#ece7df; --muted:#a09990; --line:#34302b; --field:#232120;
  --accent:#e8b878; --accent-soft:#3a2d1c; --gold:#e8b878; --stage:#0b0a09; --danger:#e58a76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --panel:#1c1a18; --ink:#ece7df; --muted:#a09990; --line:#34302b; --field:#232120;
  --accent:#e8b878; --accent-soft:#3a2d1c; --gold:#e8b878; --stage:#0b0a09; --danger:#e58a76; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:300;font-size:20px;white-space:nowrap}
.brand b{font-weight:400}.brand b span{color:var(--accent)}
.brand small{font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.picker{display:flex;gap:8px;align-items:center;flex:1 1 260px;min-width:0}
.picker select{flex:1;min-width:0;height:36px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.status{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.status.warn{color:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
.seg{display:none}

/* workspace */
.work{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);min-height:0;min-width:0}
.editor{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding-block:8px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.stage{overflow:auto;background:var(--stage);padding:28px 24px 80px;min-width:0}

details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 2px;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
summary .t{font-family:var(--f-display);font-weight:400;font-size:16px}
summary .hint{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
summary:after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:16px}
details[open]>summary:after{content:"–"}
.body{display:grid;gap:12px;padding:0 2px 18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.f{display:grid;gap:5px;min-width:0}
label.f>span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select.in,textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}

.sys{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.sys-head{display:flex;gap:8px;align-items:center}
.sys-head input{flex:1;font-weight:500}
.icon{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);background:var(--field);cursor:pointer;color:var(--muted)}
.icon:hover{color:var(--ink);border-color:var(--muted)}
.items{display:grid;gap:6px}
.item{display:grid;grid-template-columns:52px 1fr 86px 28px;gap:6px;align-items:start;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.item .wide{grid-column:2 / 4;display:grid;grid-template-columns:1fr 120px;gap:6px}
.item input,.item select{padding:6px 8px;font-size:13px}
.item .icon{width:28px;height:30px}
.items-head{display:grid;grid-template-columns:52px 1fr 86px 28px;gap:6px;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sys-total{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sys-total b{color:var(--ink);font-weight:600}
.add{justify-self:start}
.adds{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adds select{width:auto;flex:1 1 180px;padding:7px 9px}
.libsearch{position:relative;flex:1 1 220px;min-width:0}
.clientpick{position:relative}
.linked{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.linked b{color:var(--ink);font-weight:500}
.clist{display:grid;gap:0}
.crow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.crow:hover{background:var(--accent-soft)}
.crow small{display:block;color:var(--muted);font-size:11.5px}
.crow .n{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.cedit{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cedit .props{display:grid;gap:4px}
.cedit .props button{justify-self:start}
.libsearch input{width:100%;padding:8px 10px}
.libres{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto}
.libres button{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.libres button:last-child{border-bottom:0}
.libres button.on,.libres button:hover{background:var(--accent-soft)}
.libres .thumb{width:36px;height:28px}
.libres small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libres b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.libres .none{padding:10px;color:var(--muted);font-size:13px}
.libres span.n{min-width:0}
.libres span.n>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;justify-self:start;grid-column:2 / 5;text-align:left}
.details{grid-column:2 / 5;display:grid;gap:8px;padding:8px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.details textarea{min-height:64px;font-size:13px}
.imgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb{width:72px;height:54px;border-radius:6px;border:1px solid var(--line);background:var(--field) center/contain no-repeat;flex:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.small{height:30px;padding:0 10px;font-size:12.5px}
.lib{display:grid;gap:6px}
.libitem{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.libitem .thumb{width:44px;height:34px}
.libitem small{display:block;color:var(--muted);font-size:11.5px}

/* stage */
.sheets{zoom:var(--z,1);width:794px;margin:0 auto;display:grid;gap:22px}
.overflow-flag{position:absolute;top:8px;right:-8px;transform:translateX(100%);font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:var(--danger);color:#fff;padding:3px 6px;border-radius:4px;white-space:nowrap}
.empty{max-width:440px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:12px}
.empty h2{font-family:var(--f-display);font-weight:300;font-size:26px;margin:0}
.empty p{margin:0;color:var(--muted);line-height:1.5}
.busy{position:fixed;inset:0;background:rgba(10,9,8,.55);display:grid;place-items:center;z-index:50}
.busy div{background:var(--panel);color:var(--ink);padding:18px 22px;border-radius:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

/* ---------- the printed document (fixed print colours, deliberately not themed) ---------- */
.sheet{--d-ink:#141210;--d-body:#2c2926;--d-muted:#78716a;--d-line:#e6e0d6;--d-head:#f3f0ea;--d-brown:#9a5f1f;--d-gold:#e8b878;--d-cream:#f4efe6;--d-dark:#121110;
  width:794px;min-height:1123px;background:#fff;color:var(--d-body);position:relative;font-family:var(--f-body);font-size:12.6px;line-height:1.5;
  padding:72px 68px 90px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.12)}
.sheet *{box-sizing:border-box}
.sheet .mono{font-family:var(--f-mono);font-size:8.6px;letter-spacing:.3em;text-transform:uppercase}
.sheet .kick{color:var(--d-brown)}
.sheet h2{font-family:var(--f-display);font-weight:300;font-size:36px;line-height:1.1;color:var(--d-ink);margin:12px 0 20px;letter-spacing:-.005em}
.sheet h2 em{font-style:normal;color:var(--d-brown)}
.sheet h3{font-family:var(--f-display);font-weight:300;font-size:21px;color:var(--d-ink);margin:26px 0 8px}
.sheet h3:first-child{margin-top:0}
.sheet p{margin:0 0 11px}
.sheet b{font-weight:600;color:var(--d-ink)}
.sheet table{width:100%;border-collapse:collapse;margin:16px 0 4px;font-variant-numeric:tabular-nums}
.sheet th{background:var(--d-head);text-align:left;padding:10px 11px;font-weight:400;color:#6a645c;font-family:var(--f-mono);font-size:8.4px;letter-spacing:.24em;text-transform:uppercase}
.sheet td{padding:10px 11px;border-bottom:1px solid var(--d-line);vertical-align:top}
.sheet .r{text-align:right}
.sheet td.q{width:44px;color:var(--d-ink)}
.sheet td.it{color:var(--d-ink)}
.sheet td.mm{color:#5f5952;font-size:11.4px;width:36%}
.sheet td.pr{width:90px;color:var(--d-ink)}
.sheet tr.sub td{font-weight:600;color:var(--d-ink);border-bottom:1.5px solid var(--d-ink)}
.sheet tr.plain td{color:var(--d-body)}
.sheet .tag{display:inline-block;margin-left:8px;border:1px solid var(--d-gold);color:var(--d-brown);border-radius:20px;padding:1px 7px;font-family:var(--f-mono);font-size:7px;letter-spacing:.2em;text-transform:uppercase;vertical-align:2px}
.sheet .grand{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:300;font-size:22px;color:var(--d-brown);padding:14px 11px;border-bottom:1px solid var(--d-line);font-variant-numeric:tabular-nums}
.sheet ul{list-style:none;margin:4px 0 6px;padding:0}
.sheet li{position:relative;padding:3px 0 3px 16px}
.sheet li:before{content:"";position:absolute;left:3px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--d-ink)}
.sheet .foot{position:absolute;left:68px;right:68px;bottom:38px;border-top:1px solid var(--d-line);padding-top:10px;display:flex;justify-content:space-between;gap:12px;color:#9c958c;font-family:var(--f-mono);font-size:7.6px;letter-spacing:.28em;text-transform:uppercase}
.sheet .swlist{display:grid;margin-top:18px;border-top:1px solid var(--d-line)}
.sheet .swrow{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--d-line);break-inside:avoid}
.sheet .swrow .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--d-brown);padding-top:3px}
.sheet .swrow h4{font-family:var(--f-display);font-weight:400;font-size:15.5px;color:var(--d-ink);margin:0 0 4px}
.sheet .swrow p{margin:0;font-size:12.2px}
.sheet .prods{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.sheet .prod{border:1px solid var(--d-line);border-radius:10px;overflow:hidden;break-inside:avoid}
.sheet .prod .pic{height:150px;background:#f6f3ee;display:flex;align-items:center;justify-content:center;padding:14px}
.sheet .prod .pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.sheet .prod .txt{padding:14px 16px 16px}
.sheet .prod .mono{color:var(--d-brown);font-size:7.6px}
.sheet .prod h4{font-family:var(--f-display);font-weight:400;font-size:15.5px;color:var(--d-ink);margin:6px 0 6px;line-height:1.25}
.sheet .prod p{font-size:11.4px;line-height:1.5;margin:0;color:#4d4842}
.sheet .prod.solo{grid-column:1 / -1;display:grid;grid-template-columns:42% 1fr}
.sheet .prod.solo .pic{height:auto;min-height:170px}
.sheet .sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-top:34px}
.sheet .sig div{border-top:1px solid var(--d-ink);padding-top:7px;color:var(--d-muted);font-size:11px}
.sheet .signoff{margin-top:44px;color:var(--d-body);font-size:11.6px;line-height:1.6}
/* cover */
.sheet.cover{background:var(--d-dark);color:#ece7df;padding:64px 68px}
.cover .logo{height:64px;display:block}
.cover .kicker{color:var(--d-gold);margin-top:118px}
.cover h1{font-family:var(--f-display);font-weight:300;font-size:56px;line-height:1.08;margin:22px 0 0;color:#f3efe9;letter-spacing:-.01em}
.cover h1 span{display:block;color:var(--d-gold)}
.cover .lede{color:#b5aea5;font-size:14.4px;line-height:1.6;margin-top:22px;max-width:560px}
.cover hr{border:0;border-top:1px solid #36332f;margin:50px 0 32px}
.cover .meta{display:grid;grid-template-columns:1fr 1fr 1fr;row-gap:30px;column-gap:28px}
.cover .meta .mono{color:#827c74;display:block;margin-bottom:8px}
.cover .meta div{font-size:13.6px;color:#ece7df;line-height:1.45}
.cover .card{position:absolute;left:68px;right:68px;bottom:64px;background:var(--d-cream);border-radius:18px;padding:30px 40px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.cover .card .mono{color:#6f6a63}
.cover .card .amt{font-family:var(--f-display);font-weight:300;font-size:46px;color:var(--d-brown);line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.cover .card .amt small{font-size:17px;color:#8a847c;margin-left:6px}
.cover .pill{background:var(--d-gold);color:#2a1d0e;border-radius:30px;padding:7px 18px;font-size:11px;font-weight:500;white-space:nowrap}

/* phone */
@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr)}
  .actions .btn{padding:0 10px}
  .picker{flex-basis:100%}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:100%}
  .seg button{flex:1;height:34px;border:0;background:var(--field);cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .work[data-view=edit] .stage{display:none}
  .work[data-view=preview] .editor{display:none}
  .editor{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{padding:16px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .overflow-flag{right:8px;transform:none}
}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- tabs ---------- */
.tabs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.tabs button{height:34px;padding:0 14px;border:0;background:var(--field);cursor:pointer;font-size:13px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.app[data-tab=drawings] .pmode{display:none!important}
.app:not([data-tab=drawings]) .dmode{display:none!important}
.dwork{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);min-height:0;min-width:0}
.dstage{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--stage)}
.dtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.dtools select,.dtools input[type=number]{height:32px;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:0 8px}
.dtools input[type=number]{width:78px}
.dtools .grp{display:flex;gap:6px;align-items:center}
.dtools .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pal button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;color:#fff;font:600 8.5px/1 var(--f-body);cursor:pointer;display:grid;place-items:center;padding:0}
.pal button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.pal button.sel{width:auto;border-radius:15px;padding:0 10px;background:var(--field);color:var(--ink);border:1px solid var(--line);font-size:12px}
.pal button.sel[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.dscroll{overflow:auto;padding:20px;min-width:0;position:relative}
.planwrap{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);user-select:none;-webkit-user-select:none;touch-action:none}
.planwrap.placing{cursor:crosshair}
.planwrap img.base{display:block;width:100%;height:auto;pointer-events:none}
.planempty{max-width:460px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:10px}
.planempty h2{font-family:var(--f-display);font-weight:300;font-size:24px;margin:0}
.planempty p{margin:0;color:var(--muted);line-height:1.5}
.insp{position:sticky;bottom:12px;margin:14px auto 0;max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;z-index:5}
.insp .tagbig{font-family:var(--f-mono);font-size:15px;font-weight:600;letter-spacing:.06em;align-self:center;min-width:110px}
.insp label.f{min-width:100px}
.insp label.f.w{flex:1 1 180px}
.insp select,.insp input{height:32px;padding:0 8px}
.floorcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.floorcard .thumb{width:100%;height:120px;border-radius:7px;border:1px solid var(--line);background:#fff center/contain no-repeat}
.typeRow{display:grid;grid-template-columns:30px 30px 62px 1fr 28px;gap:6px;align-items:center}
.icbadge{width:30px;height:30px;border-radius:50%;background:var(--mc);border:0;color:#fff;font:600 8.5px/1 var(--f-body);display:grid;place-items:center;padding:0;cursor:pointer}
.icbadge svg,.pal button svg,.icgrid button svg{width:68%;height:68%}
.icgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.icgrid button{width:32px;height:32px;border-radius:50%;background:var(--mc);border:2px solid transparent;color:#fff;font:600 8.5px/1 var(--f-body);display:grid;place-items:center;padding:0;cursor:pointer}
.icgrid button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.typeRow .dot{width:26px;height:26px;border-radius:50%;color:#fff;font:600 8px/1 var(--f-body);display:grid;place-items:center}
.typeRow input[type=color]{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.typeMore{grid-column:1 / -1;display:grid;gap:6px;padding:8px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.pdfpick{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.pdfpick canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.dsheets{zoom:var(--dz,1);width:1587px;margin:0 auto;display:grid;gap:24px}

/* ---------- markers (shared by editor and printed sheets) ---------- */
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(var(--u,1px)*3);white-space:nowrap;pointer-events:auto}
.mk .c svg{width:70%;height:70%;display:block}
.mk .c{width:calc(var(--u,1px)*15);height:calc(var(--u,1px)*15);border-radius:50%;background:var(--mc);border:calc(var(--u,1px)*1.4) solid #fff;box-shadow:0 0 0 calc(var(--u,1px)*.4) rgba(0,0,0,.15);color:#fff;font:700 calc(var(--u,1px)*4.4)/1 "Hanken Grotesk",sans-serif;display:grid;place-items:center;flex:none;letter-spacing:-.02em}
.mk .t{display:grid;line-height:1.1;transform:translateX(calc(var(--u,1px)*.5))}
.mk .t b{font:700 calc(var(--u,1px)*4.6)/1.1 "Geist Mono",monospace;color:var(--mc);letter-spacing:.02em;text-shadow:0 0 2px #fff,0 0 2px #fff}
.mk .t span{font:400 calc(var(--u,1px)*3.6)/1.2 "Geist Mono",monospace;color:#7a746c;text-shadow:0 0 2px #fff}
.planwrap .mk{cursor:grab}
.planwrap .mk.sel .c{box-shadow:0 0 0 calc(var(--u,1px)*1.6) var(--ink)}
.planwrap.nolabels .mk .t{display:none}

/* ---------- printed A3 sheets ---------- */
.a3{--d-ink:#141210;--d-body:#2c2926;--d-line:#e6e0d6;--d-head:#f3f0ea;--d-brown:#9a5f1f;--d-gold:#e8b878;--d-dark:#121110;
  width:1587px;height:1123px;background:#fff;color:var(--d-body);position:relative;overflow:hidden;font-family:var(--f-body);box-shadow:0 1px 3px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.12)}
.a3 *{box-sizing:border-box}
.a3 .frame{position:absolute;left:20px;top:20px;right:20px;bottom:20px;border:1px solid #1a1816}
.a3 .content{position:absolute;left:21px;top:21px;right:21px;bottom:171px;padding:30px 34px;overflow:hidden}
.a3 .mono{font-family:var(--f-mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase}
.a3 .kick{color:var(--d-brown)}
.a3 h2{font-family:var(--f-display);font-weight:300;font-size:34px;color:var(--d-ink);margin:6px 0 18px;line-height:1.1}
.a3 h2 em{font-style:normal;color:var(--d-brown)}
.a3 table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.a3 th{background:var(--d-head);text-align:left;padding:8px 9px;font-weight:400;color:#6a645c;font-family:var(--f-mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase}
.a3 td{padding:6px 9px;border-bottom:1px solid var(--d-line);vertical-align:top}
.a3 td.id{font-family:var(--f-mono);font-size:10.5px;color:var(--d-brown);white-space:nowrap}
.a3 td.m{font-family:var(--f-mono);font-size:10px;white-space:nowrap}
.a3 td.box{width:26px;border-left:1px solid var(--d-line);border-right:1px solid var(--d-line)}
.a3 tr.sum td{font-weight:600;color:var(--d-ink);border-bottom:1.5px solid var(--d-ink)}
.a3 .r{text-align:right}
.a3 .two{display:grid;grid-template-columns:1.25fr 1fr;gap:46px}
.a3 .big{display:flex;gap:44px;margin:4px 0 26px}
.a3 .big div{font-family:var(--f-display);font-weight:300;font-size:56px;color:var(--d-brown);line-height:1}
.a3 .big small{display:block;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.3em;color:#7a746c;margin-top:6px}
.a3 .notes p{margin:0 0 10px;font-size:12px;line-height:1.55}
.a3 .notes .muted{color:#8a847c}
.a3 .plan{position:absolute;left:21px;top:21px;right:21px;bottom:171px;display:grid;place-items:center;padding:26px}
.a3 .plan .pw{position:relative}
.a3 .plan .pw img{display:block;width:100%;height:100%}
.a3 .legend{position:absolute;right:30px;top:30px;width:258px;background:#f4efe6;border-radius:10px;padding:16px 18px;display:grid;gap:7px;z-index:2}
.a3 .legend .mono{color:var(--d-brown);margin-bottom:4px}
.a3 .legend .li{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--d-ink)}
.a3 .legend .li i{width:18px;height:18px;border-radius:50%;background:var(--mc);color:#fff;font:700 5.5px/18px "Hanken Grotesk",sans-serif;text-align:center;font-style:normal;flex:none;display:grid;place-items:center}
.a3 .legend .li i svg{width:72%;height:72%;display:block}
.a3 .legend p{margin:4px 0 0;font-size:10px;color:#6a645c;line-height:1.45}
.a3 .tb{position:absolute;left:21px;right:21px;bottom:21px;height:150px;background:var(--d-dark);color:#ece7df;display:grid;grid-template-columns:300px 1.05fr 1.5fr 1.05fr 1fr}
.a3 .tb>div{padding:16px 18px;border-left:1px solid #2e2b28;min-width:0}
.a3 .tb>div:first-child{border-left:0;display:flex;flex-direction:column;justify-content:space-between}
.a3 .tb img{height:56px;align-self:flex-start}
.a3 .tb .tag{font-family:var(--f-mono);font-size:6.6px;letter-spacing:.16em;white-space:nowrap;color:var(--d-gold);text-transform:uppercase}
.a3 .tb .lab{font-family:var(--f-mono);font-size:7.5px;letter-spacing:.3em;color:#8a847c;text-transform:uppercase;display:block;margin-bottom:4px}
.a3 .tb .val{font-size:20px;font-family:var(--f-display);font-weight:300;color:#f3efe9;line-height:1.15}
.a3 .tb .val em{font-style:normal;color:var(--d-gold)}
.a3 .tb .sm{font-size:11px;color:#b5aea5;margin-top:3px}
.a3 .tb .sub{font-family:var(--f-mono);font-size:8px;letter-spacing:.3em;color:var(--d-gold);margin-top:6px;text-transform:uppercase}
.a3 .tb .pills{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.a3 .tb .pills span{border:1px solid #4a4642;border-radius:20px;padding:4px 10px;font-size:9px;color:#b5aea5}
.a3 .tb .pills span.on{background:var(--d-gold);border-color:var(--d-gold);color:#2a1d0e;font-weight:500}
.a3 .tb .rev{display:grid;grid-template-columns:22px 70px 1fr 26px;gap:6px;font-size:9.5px;color:#d5cfc6;padding:5px 0;border-bottom:1px solid #2e2b28}
.a3 .tb .rev span:first-child{color:var(--d-gold)}
.a3 .tb .num{font-family:var(--f-mono);font-size:21px;letter-spacing:.06em;color:var(--d-gold);margin:2px 0 10px}
.a3 .tb .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.a3 .tb .kv div{font-size:10.5px;color:#ece7df}
.a3 .tb .kv .lab{margin-bottom:2px;font-size:7px}

@media (max-width:860px){
  .dwork{grid-template-columns:minmax(0,1fr)}
  .dwork[data-view=edit] .dstage{display:none}
  .dwork[data-view=preview] .editor{display:none}
}


/* ---------- jobs ---------- */
.app[data-tab=jobs] .pmode{display:none!important}
.app:not([data-tab=jobs]) .jmode{display:none!important}
.jwork{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);min-height:0;min-width:0}
.jlist{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.jlist .top{display:grid;gap:8px;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.jlist .top input{width:100%;height:36px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:12px;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jrows{overflow:auto}
.jrow{display:grid;grid-template-columns:4px 1fr auto;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px 10px max(12px,env(safe-area-inset-left,0px));cursor:pointer;color:var(--ink)}
.jrow:hover{background:var(--accent-soft)}
.jrow.on{background:var(--accent-soft)}
.jrow .jbar{border-radius:2px;background:var(--js);align-self:stretch}
.jrow .jm{display:grid;min-width:0}
.jrow .n{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--muted)}
.jrow .c{font-weight:500;font-size:14px;margin:1px 0}
.jrow small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.jrow .when{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.spill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--js);color:#fff;font-weight:500;white-space:nowrap}
.jstage{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--bg)}
.jscroll{overflow:auto;min-width:0;position:relative}
.jdetail{max-width:880px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
.jhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.jhead h2{font-family:var(--f-display);font-weight:300;font-size:28px;margin:0;flex:1 1 auto;min-width:0}
.jhead .num{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--accent)}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.jcard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.jcard h3 small{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:400}
.vrow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.4fr 32px;gap:8px;align-items:end}
.trow{display:grid;grid-template-columns:1.3fr 1fr 1fr 70px 32px;gap:8px;align-items:end}
.vrow input,.trow input,.vrow select{padding:7px 8px;font-size:13px}
.trow .hrs{font-variant-numeric:tabular-nums;font-size:13px;padding-bottom:9px;text-align:right}
.note-log{display:grid;gap:10px}
.note-log .ni{border-left:2px solid var(--gold);padding:2px 0 2px 12px}
.note-log .ni small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.note-log .ni div{white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.clock{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock .run{font-family:var(--f-mono);font-size:13px;color:var(--danger)}
/* week calendar */
.cal{--hr:46px;min-width:760px;padding:0 16px 40px}
.calhead{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.calhead div{padding:10px 6px 8px;font-size:12px;color:var(--muted);text-align:center}
.calhead div b{display:block;font-family:var(--f-display);font-weight:300;font-size:22px;color:var(--ink);line-height:1.1}
.calhead div.today b{color:var(--accent)}
.calbody{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));position:relative}
.calbody .hrs{position:relative}
.calbody .hrs span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.calday{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hr);cursor:copy}
.calday.today{background-color:var(--accent-soft)}
.calday.weekend{background-color:color-mix(in srgb,var(--panel) 60%,transparent)}
.blk{position:absolute;left:3px;right:3px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;border-radius:7px;background:var(--js);color:#fff;padding:5px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.18);border:0;text-align:left}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.sel{outline:2px solid var(--ink);outline-offset:1px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.agenda{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 60px;display:grid;gap:14px}
.agenda h4{margin:6px 0 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.agenda .blk{position:static;width:100%;margin-top:6px;padding:9px 12px;font-size:13px}
@media (max-width:860px){
  .jwork{grid-template-columns:minmax(0,1fr)}
  .jwork[data-view=edit] .jstage{display:none}
  .jwork[data-view=preview] .jlist{display:none}
  .vrow,.trow{grid-template-columns:1fr 1fr;}
}


/* outlook */
.blk.ol{background:repeating-linear-gradient(135deg,#8a847c 0 6px,#938d85 6px 12px);color:#fff;text-decoration:none;display:block;opacity:.9;box-shadow:none}
.blk.ol:hover{opacity:1}
.olad{display:block;margin:4px 2px 0;padding:2px 6px;border-radius:5px;background:#8a847c;color:#fff;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;text-align:left}
.olchip{grid-column:1 / -1;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:-2px 0 4px}
.olchip a,.olchip button{color:var(--accent);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.olchip.err{color:var(--danger)}
.olchip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.olchip.ok .dot{background:#4c7a5a}
#jbCal[data-ol=on]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4c7a5a;margin-right:7px;vertical-align:1px}
#jbCal[data-ol=err]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:7px;vertical-align:1px}
.olbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.olbar.err{color:var(--danger)}
.olbar button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}

/* customers */
.app[data-tab=customers] .pmode{display:none!important}
.app:not([data-tab=customers]) .cmode{display:none!important}
.app:not([data-tab=proposals]) #work{display:none!important}
.cukey textarea{min-height:70px}
.culink{display:grid;gap:6px}
.culink button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 12px;cursor:pointer;color:var(--ink);font:inherit}
.culink button:hover{background:var(--accent-soft)}
.culink .n{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.culink small{color:var(--muted);font-size:12px;display:block}
.jrow .src{font-size:10.5px;color:var(--accent);font-family:var(--f-mono);letter-spacing:.06em}
.qstat{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--ink)}
.qstat.Accepted{background:#4c7a5a;color:#fff}.qstat.Sent{background:#3f6f9e;color:#fff}.qstat.Declined{background:#857f77;color:#fff}
/* deposit */
.deplist{display:grid;gap:2px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--field)}
.deplist .dsys{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
.deplist label{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.deplist label b{font-weight:500;font-variant-numeric:tabular-nums}
.deplog{font-size:12px;color:var(--muted)}
/* accept button on the quote */
.sheet .acceptbtn{display:inline-block;margin:6px 0 4px;padding:11px 22px;border-radius:30px;background:var(--d-gold,#e8b878);color:#2a1d0e;font-weight:600;font-size:13px;text-decoration:none;letter-spacing:.01em}
.sheet .acceptnote{font-size:11px;color:#8a847c;margin:2px 0 14px}

.toast.undo{display:flex;gap:14px;align-items:center}
.toast.undo button{background:none;border:1px solid currentColor;color:inherit;border-radius:7px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer}
.emchip{grid-column:1 / -1;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:-2px 0 6px}
.emchip button.lnk{color:var(--accent);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.emchip.warn{color:var(--danger)}
.empanel{grid-column:1 / -1;display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:0 0 8px}
.empanel textarea{min-height:150px;font-size:13px;line-height:1.5}

/* job extras */
.mrow{display:grid;grid-template-columns:64px 1fr 96px 84px 32px;gap:8px;align-items:center}
.mrow input{padding:7px 8px;font-size:13px}
.mrow .lt{font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.mrow.inv{opacity:.6}
.mrow small.invd{grid-column:2 / -1;font-size:11px;color:var(--muted);margin-top:-4px}
.mrow small.sub{grid-column:2 / -1;font-size:11px;color:var(--muted);margin-top:-4px}
.mtot{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.jxlib{position:relative;flex:1 1 220px}
.jxlib input{width:100%}
.invsum{display:grid;gap:6px;font-size:13px}
.invsum div{display:flex;justify-content:space-between;gap:10px}
.invsum b{font-variant-numeric:tabular-nums}
.invlog{font-size:12px;color:var(--muted);display:grid;gap:3px}
.invlog a{color:var(--accent)}
.jxfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.jxfiles .f{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--field) center/cover no-repeat;display:flex;align-items:flex-end;text-decoration:none;color:var(--ink);overflow:hidden}
.jxfiles .f span{font-size:10.5px;padding:4px 6px;background:color-mix(in srgb,var(--panel) 85%,transparent);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jxfiles .f.doc{align-items:center;justify-content:center;flex-direction:column;font-size:12px;text-align:center;padding:6px}
.jxfiles .f.doc b{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.jxfiles .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:13px;line-height:22px;padding:0}
.sigpad{width:100%;height:170px;border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair}
.sheetlog{font-size:12.5px;display:grid;gap:4px}
.sheetlog a{color:var(--accent)}
/* reports */
.rp{max-width:1000px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
.rp .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rp .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rp .kpi small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rp .kpi b{display:block;font-family:var(--f-display);font-weight:300;font-size:30px;margin-top:4px;font-variant-numeric:tabular-nums}
.rp .kpi span{font-size:12px;color:var(--muted)}
.rp table{width:100%;border-collapse:collapse;font-size:13px}
.rp th{text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line)}
.rp td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rp td.r,.rp th.r{text-align:right}
.rp tr.click{cursor:pointer}.rp tr.click:hover td{background:var(--accent-soft)}
@media (max-width:860px){ .mrow{grid-template-columns:54px 1fr 80px 32px} .mrow .lt{display:none} }

.cbar{display:flex;flex-wrap:wrap;gap:8px}
.cbar a{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500}
.cbar a:hover{background:var(--accent-soft)}
.cbar a.call{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cbar svg{width:16px;height:16px;flex:none}
.cbar:empty{display:none}

.aimodal{position:fixed;inset:0;background:rgba(10,9,8,.45);z-index:70;display:grid;place-items:center;padding:16px}
.aibox{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:12px}
.aibox h2{margin:0;font-family:var(--f-display);font-weight:300;font-size:24px}
.aibox textarea{min-height:200px;font-size:15px;line-height:1.5}
.aibox .aistat{font-size:13px;color:var(--muted);min-height:18px}
.aibox .aistat.warn{color:var(--danger)}

/* knowledge base */
.app[data-tab=knowledge] .pmode{display:none!important}
.app:not([data-tab=knowledge]) .kmode{display:none!important}
.kbmeta{font-size:12.5px;color:var(--muted)}
.kbmeta a{color:var(--accent)}
.kbbody{font-size:15px;line-height:1.6;gap:0}
.kbbody>*{margin:0 0 10px}
.kbbody>*:last-child{margin-bottom:0}
.kbbody h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:14px 0 6px}
.kbbody h3{font-size:16px;font-weight:600;margin:12px 0 4px}
.kbbody h4{font-size:14px;font-weight:600;margin:10px 0 4px}
.kbbody ul,.kbbody ol{padding-left:22px}
.kbbody ul.chk{list-style:none;padding-left:2px}
.kbbody ul.chk label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.kbbody ul.chk input{margin-top:5px}
.kbbody ul.chk input:checked+span{text-decoration:line-through;color:var(--muted)}
.kbbody code{font-family:var(--f-mono);font-size:.88em;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.kbbody pre{background:#1c1a17;color:#efe9df;border-radius:8px;padding:12px 14px;overflow:auto;font-size:12.5px;line-height:1.5}
.kbbody pre code{background:none;border:0;padding:0;color:inherit}
.kbbody blockquote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--muted)}
.kbbody img{max-width:100%;border-radius:8px;display:block}
.kbbody a{color:var(--accent);word-break:break-word}
.kbbody hr{border:0;border-top:1px solid var(--line)}
.kbtools{display:flex;flex-wrap:wrap;gap:6px}
#kbBody{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;min-height:320px}
.kbfiles{display:flex;flex-wrap:wrap;gap:6px}
.kbfile{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--field);border-radius:14px;padding:3px 10px;font-size:12.5px}
.kbfile a{color:var(--ink)}

/* price file */
.app[data-tab=prices] .pmode{display:none!important}
.app:not([data-tab=prices]) .rmode{display:none!important}
.prwork{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0;background:var(--bg)}
.prtools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.prtools input[type=search]{flex:1 1 240px;height:36px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0 10px}
.prscroll{overflow:auto;min-width:0}
.prtable{width:100%;border-collapse:collapse;font-size:13px}
.prtable th{position:sticky;top:0;background:var(--bg);z-index:2;text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:9px 8px;border-bottom:1px solid var(--line)}
.prtable td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.prtable td input{width:100%;padding:6px 7px;font-size:13px;border:1px solid transparent;background:transparent;border-radius:6px}
.prtable td input:hover{border-color:var(--line)}
.prtable td input:focus{border-color:var(--accent);background:var(--field)}
.prtable td.price input{text-align:right;font-variant-numeric:tabular-nums}
.prtable td.code input{font-family:var(--f-mono);font-size:11.5px}
.prtable tr.nop td.price input{color:var(--danger)}
.xs{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;color:var(--muted)}
.xs i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.xs.ok i{background:#4c7a5a}.xs.chg i{background:#b8742a}.xs.err{color:var(--danger)}.xs.err i{background:var(--danger)}
.xs button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.prmore{padding:14px;text-align:center}
.prsync{font-size:12.5px;color:var(--muted)}
.prsync.warn{color:var(--danger)}
@media (max-width:860px){ .tabs{flex:1 1 100%;max-width:100%;overflow-x:auto;scrollbar-width:none} .tabs button{flex:1 0 auto;padding:0 10px} .prtable .sup,.prtable th.sup{display:none} .prtable td.code{width:96px} }
</style>

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));
const isoDay = d => d.toISOString().slice(0, 10);
function longDate(iso){ if(!iso) return ""; const d = new Date(iso + "T12:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); }
function money(n, p){ const pence = p.showPence; return "£" + Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:pence?2:0,maximumFractionDigits:pence?2:0}); }
// "**bold** text" and "Label: rest" support inside list lines
function inline(s){ let h = esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); return h; }
function tokens(s, p){ return String(s||"").replace(/\{valid\}/g, longDate(p.validUntil)).replace(/\{ref\}/g, p.ref||"").replace(/\{rate\}/g, money(p.rate,p)); }

/* ---------- maths ---------- */
function totals(p){
  const sys = p.systems.map(s => {
    const equip = s.items.reduce((a,i)=>a + num(i.qty)*num(i.price), 0);
    const inst = num(s.hours) * num(p.rate);
    return { equip, inst, total: equip + inst };
  });
  const equip = sys.reduce((a,s)=>a+s.equip,0), inst = sys.reduce((a,s)=>a+s.inst,0);
  const contr = (p.contractors||[]).reduce((a,c)=>a + num(c.qty)*num(c.rate), 0);
  const sub = equip + inst + contr, allow = num(p.allowance), net = sub + allow, gst = p.gst ? net*0.05 : 0;
  return { sys, equip, inst, contr, sub, allow, net, gst, grand: net + gst };
}

function acceptHref(p){
  const t = totals(p), ref = [p.ref, p.rev].filter(Boolean).join(" "), doc = String(p.docType || "Quotation");
  const subj = `Accepting ${doc.toLowerCase()} ${ref}${p.titleA ? " – " + p.titleA : ""}`;
  const body = [`Hello Ian,`, ``, `I accept ${doc.toLowerCase()} ${ref}${p.titleA ? " (" + p.titleA + ")" : ""} for ${money(t.grand, p)}${p.gst ? " including GST" : ""}, on the terms set out in it.`, ``, `Name: `, `Company: ${p.signedFor || p.preparedFor || ""}`, `Date: `, ``, `Thank you`].join("\r\n");
  return `mailto:${p.acceptEmail}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}
function depLines(p){
  const mode = p.invMode || "hardware", t = totals(p), doc = String(p.docType || "Quotation").toLowerCase(), ref = [p.ref, p.rev].filter(Boolean).join(" ");
  if(mode === "stage"){ const pct = num(p.depPct); return pct > 0 ? [{ desc: `${p.stageLabel ? p.stageLabel + ": " : "Stage payment: "}${pct}% of ${doc} ${ref}${p.titleA ? " – " + p.titleA : ""}`, qty: 1, unit: Math.round(t.grand * pct) / 100 }] : []; }
  if(mode === "final"){ const paid = invPaid(p), bal = Math.round((t.grand - paid) * 100) / 100; return bal > 0 ? [{ desc: `Final balance for ${doc} ${ref}${p.titleA ? " – " + p.titleA : ""} (total ${money(t.grand, {showPence:true})}${paid ? ` less ${money(paid, {showPence:true})} already invoiced` : ""})`, qty: 1, unit: bal }] : []; }
  const pct = num(p.depPct) || 100, out = [];
  p.systems.forEach(s=>s.items.forEach(it=>{ if(it.dep && (it.item || num(it.price))) out.push({ desc: [it.item, it.model].filter(Boolean).join(" – ") + (pct < 100 ? ` (${pct}% deposit)` : ""), qty: num(it.qty) || 1, unit: Math.round(num(it.price) * pct) / 100 }); }));
  return out;
}

      <table><tr><th>Trade</th><th>Work</th><th>Time</th><th class="r">Price</th></tr>
      ${crows.map(c=>`<tr><td class="it" style="width:26%">${esc(c.who)}</td><td>${esc(c.work)}</td><td class="mm" style="width:24%">${unitLabel(c)}</td><td class="r pr">${money(num(c.qty)*num(c.rate),p)}</td></tr>`).join("")}
      <tr class="sub"><td colspan="3">${esc(p.contractorTitle||"Contractor labour")} total</td><td class="r">${money(t.contr,p)}</td></tr></table>
    </article>`);
  }

  // small print
  const list = (h, s) => { const l = lines(tokens(s,p)); return l.length ? `<h3>${h}</h3><ul>${l.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>` : ""; };
  const sp = (p.pricedTo?`<p><b>Priced to:</b> ${esc(p.pricedTo)}</p>`:"") + list("Included",p.included) + list("Assumptions",p.assumptions) + list("Not included",p.excluded);
  if(sp.trim()) pages.push(`<article class="sheet"><div class="mono kick">Basis of ${esc(p.docType.toLowerCase())}</div><h2>The <em>small print.</em></h2>${sp}</article>`);

  // next steps, terms, acceptance
  const nx = lines(p.next);
  const company = p.signedFor || p.preparedFor;
  pages.push(`<article class="sheet">
    ${nx.length?`<div class="mono kick">Next steps</div><h2>To <em>firm up</em> the price.</h2>${p.nextIntro?`<p>${inline(p.nextIntro)}</p>`:""}<ul>${nx.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`:`<div class="mono kick">Terms</div><h2>Terms and <em>acceptance.</em></h2>`}
    ${list(nx.length?"Terms":"Terms of this "+esc(p.docType.toLowerCase()),p.terms)}
    <h3>Acceptance</h3><p>${inline(tokens(p.acceptance,p))}</p>
    ${p.acceptButton && p.acceptEmail ? `<a class="acceptbtn" href="${esc(acceptHref(p))}">Accept this ${esc(String(p.docType||"quotation").toLowerCase())}</a><p class="acceptnote">Opens an email to ${esc(p.acceptEmail)}, ready to send.</p>` : ""}
    <div class="sig"><div>Signed for ${esc(company)}</div><div>Name</div><div>Date</div></div>
    <div class="signoff">${lines(p.signoff).map((l,i)=>i===0?`<b>${esc(l)}</b>`:esc(l)).join("<br>")}</div>
  </article>`);

  return pages.map((h,i)=> i===0 ? h : h.replace(/<\/article>$/, foot(i+1)+"</article>")).join("");
}

/* ---------- state + persistence ---------- */
let db = null, list = [], current = null, dirty = false, saving = false, saveTimer = null, previewTimer = null, mode = "loading";
const LS = "halojeProposals.v1";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS) || "[]"); }catch(e){ return []; } }
function lsWrite(){ try{ localStorage.setItem(LS, JSON.stringify(list)); return true; }catch(e){ return false; } }
function setStatus(t, warn){ const s = $("#status"); s.textContent = t; s.classList.toggle("warn", !!warn); }

function scheduleSave(){ dirty = true; setStatus("Unsaved"); clearTimeout(saveTimer); saveTimer = setTimeout(save, 900); }
async function save(){
  if(!current || saving) { if(saving) scheduleSave(); return; }
  current.updated = Date.now();
  const snap = clone(current);
  const i = list.findIndex(x=>x.id===snap.id); if(i>=0) list[i] = snap; else list.unshift(snap);
  if(mode === "db"){
    saving = true; setStatus("Saving");
    try{ await db.collection("proposals").doc(snap.id).set({ title: snap.titleA, ref: snap.ref, updated: snap.updated, data: snap }); dirty = false; setStatus("Saved"); }
    catch(e){ setStatus(e && e.code === "permission_denied" ? "View only" : "Not saved, retrying", true); if(!(e && e.code==="permission_denied")) setTimeout(save, 4000); }
    saving = false;
  } else { const ok = lsWrite(); dirty = false; setStatus(ok ? "Saved on this device" : "Not saved", !ok); }
  fillPicker();
}

function fillPicker(){
  const sel = $("#pick"); const items = list.slice().sort((a,b)=>b.updated-a.updated);
  sel.innerHTML = items.length ? items.map(p=>`<option value="${esc(p.id)}">${esc(p.ref||"No ref")} · ${esc(p.titleA||"Untitled")}${p.qStatus && p.qStatus!=="Draft" ? " · " + esc(p.qStatus) : ""}</option>`).join("") : `<option value="">No proposals yet</option>`;
  if(current) sel.value = current.id;
  $("#btnDup").disabled = $("#btnDel").disabled = $("#btnPdf").disabled = $("#btnHtml").disabled = $("#btnSend").disabled = !current;
}

function open(id){
  const p = list.find(x=>x.id===id); if(!p) return;
  current = normalise(clone(p)); openDetails.clear(); buildEditor(); renderPreview(); fillPicker();
  try{ localStorage.setItem(LS+".last", id); }catch(e){}
}
function createNew(base){
  const p = base ? Object.assign(normalise(clone(base)), { id: uid(), ref: (base.ref||"") + "-COPY" }) : blankProposal();
  list.unshift(p); current = normalise(clone(p)); buildEditor(); renderPreview(); fillPicker(); save();
  if(innerWidth <= 860) setView("edit");
}

$("#editor").addEventListener("input", e=>{
  const k = e.target.dataset.k; if(!k || !current) return;
  let v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if(e.target.type === "number") v = e.target.value === "" ? "" : num(e.target.value);
  setPath(k, v); scheduleSave(); queuePreview();
  current.systems.forEach((s,i)=>{ const el = $("#st"+i); if(el){ const t = totals(current).sys[i]; el.innerHTML = `<span>Equipment ${money(t.equip,current)} · Labour ${money(t.inst,current)}</span><b>${money(t.total,current)}</b>`; }});
  if(k==="titleA"||k==="ref"||k==="qStatus") fillPickerLabel();
  if(k==="invMode"||k==="qStatus") buildEditor();
  if(/\.dep$|^depPct$|^stageLabel$/.test(k)){ const dt = $("#depTotal"); if(dt) dt.textContent = money(depTotal(current), {showPence:true}); const dh = $("#depHint"); if(dh) dh.textContent = depHint(current); }
  if(k==="acceptButton"||k==="docType") buildEditor();
  if(k==="qStatus" && v==="Accepted" && !current.acceptedOn){ current.acceptedOn = jbToday(); const el = $("#f_acceptedOn"); if(el) el.value = current.acceptedOn; }
  const cm = k.match(/^contractors\.(\d+)\.(\w+)$/);
  if(cm){ const c = current.contractors[+cm[1]], el = $("#ct"+cm[1]); if(el && c) el.textContent = money(num(c.qty)*num(c.rate), current); if(cm[2]==="unit") buildEditor(); }
});
function fillPickerLabel(){ const o = $("#pick").selectedOptions[0]; if(o) o.textContent = `${current.ref||"No ref"} · ${current.titleA||"Untitled"}${current.qStatus && current.qStatus!=="Draft" ? " · " + current.qStatus : ""}`; }
$("#editor").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || !current) return;
  const i = +b.dataset.i, j = +b.dataset.j, S = current.systems;
  switch(b.dataset.act){
    case "addSys": S.push({name:"New system",desc:"",hours:0,work:"",items:[newItem()]}); break;
    case "rmSys": S.splice(i,1); break;
    case "up": [S[i-1],S[i]] = [S[i],S[i-1]]; break;
    case "down": [S[i+1],S[i]] = [S[i],S[i+1]]; break;
    case "addItem": S[i].items.push(newItem()); break;
    case "more": { const key = i+"-"+j; openDetails.has(key) ? openDetails.delete(key) : openDetails.add(key); break; }
    case "rmImg": S[i].items[j].img = ""; break;
    case "saveLib": saveToLibrary(S[i].items[j]); return;
    case "rmLib": removeFromLibrary(b.dataset.id, b); return;
    case "stdStages": current.scopeStages = STD_STAGES; break;
    case "addContr": current.contractors.push(newContractor()); break;
    case "rmContr": current.contractors.splice(j,1); break;
    case "depAll": S.forEach(s=>s.items.forEach(it=>{ if(it.item || num(it.price)) it.dep = true; })); break;
    case "depNone": S.forEach(s=>s.items.forEach(it=>{ it.dep = false; })); break;
    case "depCsv": depCsv(); return;
    case "depXero": depXero(b); return;
    case "mkJob": qMakeJob(); return;
    case "openJob": { const jid = current.jobId; setTab("jobs"); setTimeout(()=>jbOpen(jid), 300); return; }
    case "poOpen": poOpen = b.dataset.sup; buildEditor(); { const t = $("#poTo"); t && t.focus(); } return;
    case "poCancel": poOpen = null; buildEditor(); return;
    case "poSend": poSend(b); return;
    case "poSup": { const v = ($("#poSupName")||{}).value || ""; if(!v.trim()) return; S.forEach(s=>s.items.forEach(it=>{ if((it.item || num(it.price)) && !poSupOf(it)) it.supplier = v.trim(); })); break; }
    default: return;
    case "rmItem": S[i].items.splice(j,1); break;
  }
  buildEditor(); renderPreview(); scheduleSave();
  if(b.dataset.act==="addItem"){ const el = $(`#s${i}i${S[i].items.length-1}n`); el && el.focus(); }
});

async function getAssets(){ if(!assetsTried){ assetsTried = true; try{ assets = window.claude ? await claude.use("assets") : null; }catch(e){ assets = null; } } return assets; }
function shrink(file, max, type, q){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{ const k = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement("canvas");
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); const x = c.getContext("2d");
      if(type === "image/jpeg"){ x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); }
      x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res({blob:b, canvas:c}):rej(new Error("encode")), type, q); };
    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("That file isn't an image this browser can read.")); };
    im.src = url;
  });
}
async function uploadPhoto(file){
  const png = /png|svg|webp|gif/.test(file.type);
  const a = await getAssets();
  if(a){ const { blob } = await shrink(file, 1400, png ? "image/png" : "image/jpeg", 0.88); const r = await a.upload(blob); return r.url; }
  const { canvas } = await shrink(file, 700, "image/jpeg", 0.82); return canvas.toDataURL("image/jpeg", 0.82);
}

function addFromLibrary(i, id){
  const pr = products.find(x=>x.id===id); if(!pr || !current) return;
  const S = current.systems[i], it = Object.assign(newItem(), { item: pr.item, model: pr.model || "", price: num(pr.price), desc: pr.desc || "", img: pr.img || "", libId: pr.id });
  const blank = S.items.findIndex(x=>!x.item && !x.model && !num(x.price));
  if(blank >= 0) S.items[blank] = it; else S.items.push(it);
  buildEditor(); renderPreview(); scheduleSave(); toast(`Added ${pr.item}`);
  const q = $("#lq"+i); q && q.focus();
}
function searchProducts(q, limit){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const out = [];
  for(const pr of products){
    const hay = (pr._hay ||= [pr.item, pr.model, pr.code, pr.supplier, pr.category].join(" ").toLowerCase());
    if(toks.every(t=>hay.includes(t))){
      const name = String(pr.item||"").toLowerCase();
      const score = (name.startsWith(toks[0]) ? 0 : name.includes(toks[0]) ? 1 : 2) + (pr.img ? 0 : .5) + name.length/1000;
      out.push([score, pr]);
    }
  }
  return out.sort((a,b)=>a[0]-b[0]).slice(0, limit).map(x=>x[1]);
}

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3800); }
const undoQ = new Set();
function undoToast(msg, onUndo, onCommit, ms = 8000){
  document.querySelectorAll(".toast.undo").forEach(x=>x.remove());
  const t = document.createElement("div"); t.className = "toast undo"; t.setAttribute("role", "status");
  const sp = document.createElement("span"); sp.textContent = msg; const b = document.createElement("button"); b.textContent = "Undo";
  t.append(sp, b); document.body.appendChild(t);
  let done = false;
  const commit = ()=>{ if(done) return; done = true; undoQ.delete(commit); clearTimeout(tm); t.remove(); try{ onCommit && onCommit(); }catch(e){ console.error(e); } };
  const tm = setTimeout(commit, ms); undoQ.add(commit);
  b.addEventListener("click", ()=>{ if(done) return; done = true; undoQ.delete(commit); clearTimeout(tm); t.remove(); onUndo && onUndo(); });
}
addEventListener("pagehide", ()=>{ [...undoQ].forEach(f=>f()); });

    const ab = sheet.querySelector(".acceptbtn"); let ar = null;
    if(ab){ const sr = sheet.getBoundingClientRect(), r = ab.getBoundingClientRect(); ar = { x: (r.left-sr.left)*2, y: (r.top-sr.top)*2, w: r.width*2, h: r.height*2, url: ab.getAttribute("href") }; }

}

/* ---------- state + persistence ---------- */
let dwList = [], dwCur = null, dwDirty = false, dwSaving = false, dwSaveT = null, dwFloor = 0, dwSel = null, dwView = "plan", dwZoom = 1, dwLabels = true, dwStarted = false, dwPdf = null;
let dwTool = { type: null, room: "", mount: "", height: "" };
const LSD = LS + ".drawings";
function dwSetStatus(t, warn){ const s = $("#dwStatus"); if(s){ s.textContent = t; s.classList.toggle("warn", !!warn); } }
function dwSchedule(){ dwDirty = true; dwSetStatus("Unsaved"); clearTimeout(dwSaveT); dwSaveT = setTimeout(dwSave, 900); }
async function dwSave(){
  if(!dwCur) return; if(dwSaving){ dwSchedule(); return; }
  dwCur.updated = Date.now(); const snap = clone(dwCur);
  const i = dwList.findIndex(x=>x.id===snap.id); if(i>=0) dwList[i] = snap; else dwList.unshift(snap);
  if(mode === "db"){
    dwSaving = true; dwSetStatus("Saving");
    try{ await db.collection("drawings").doc(snap.id).set({ name: snap.name, updated: snap.updated, data: snap }); dwDirty = false; dwSetStatus("Saved"); }
    catch(e){ dwSetStatus("Not saved, retrying", true); setTimeout(dwSave, 4000); }
    dwSaving = false;
  } else { try{ localStorage.setItem(LSD, JSON.stringify(dwList)); dwSetStatus("Saved on this device"); }catch(e){ dwSetStatus("Not saved", true); } dwDirty = false; }
  dwFillPicker();
}
function dwFillPicker(){
  const sel = $("#dwPick"); if(!sel) return;
  const items = dwList.slice().sort((a,b)=>b.updated-a.updated);
  sel.innerHTML = items.length ? items.map(p=>`<option value="${esc(p.id)}">${esc(p.prefix||"")} · ${esc(p.name||"Untitled")}</option>`).join("") : `<option value="">No drawing sets yet</option>`;
  if(dwCur) sel.value = dwCur.id;
  ["#dwDup","#dwDel","#dwPdfBtn","#dwCsv"].forEach(s=>{ const b = $(s); if(b) b.disabled = !dwCur; });
}
function dwOpen(id){
  const p = dwList.find(x=>x.id===id); if(!p) return;
  dwCur = dwNorm(clone(p)); dwFloor = 0; dwSel = null; dwPdf = null; dwTool.type = null;
  dwBuildEditor(); dwRender(); dwFillPicker();
  try{ localStorage.setItem(LSD+".last", id); }catch(e){}
}
function dwCreate(base){
  const p = base ? Object.assign(dwNorm(clone(base)), { id: uid(), name: base.name + " (copy)" }) : dwBlank();
  dwList.unshift(p); dwCur = dwNorm(clone(p)); dwFloor = 0; dwSel = null; dwBuildEditor(); dwRender(); dwFillPicker(); dwSave();
}
async function dwStart(){
  if(dwStarted) return; dwStarted = true;
  dwBuildEditor(); dwRender();
  const last = (()=>{ try{ return localStorage.getItem(LSD+".last"); }catch(e){ return null; } })();
  if(mode === "db"){
    let first = true;
    db.collection("drawings").orderBy("updated","desc").onSnapshot(snap=>{
      dwList = snap.docs.map(d=>{ const b = d.data() || {}; return dwNorm(Object.assign({}, b.data || {}, { id: d.id, updated: b.updated || 0 })); });
      if(first){ first = false; dwSetStatus(dwList.length ? "Saved" : "Ready"); if(dwList.length) dwOpen((dwList.find(x=>x.id===last) || dwList[0]).id); else { dwBuildEditor(); dwRender(); dwFillPicker(); } return; }
      if(dwCur){ const r = dwList.find(x=>x.id===dwCur.id); if(r && !dwDirty && !dwSaving && r.updated > dwCur.updated){ dwCur = dwNorm(clone(r)); dwBuildEditor(); dwRender(); } }
      dwFillPicker();
    }, ()=>dwSetStatus("Offline", true));
  } else {
    try{ dwList = JSON.parse(localStorage.getItem(LSD) || "[]").map(dwNorm); }catch(e){ dwList = []; }
    dwSetStatus(dwList.length ? "Saved on this device" : "On this device only");
    if(dwList.length) dwOpen((dwList.find(x=>x.id===last) || dwList[0]).id); else { dwBuildEditor(); dwRender(); dwFillPicker(); }
  }
}

$("#dwEditor").addEventListener("input", e=>{
  if(!dwCur) return;
  const k = e.target.dataset.dk;
  if(k){
    let v = e.target.value; if(e.target.type === "number" || e.target.dataset.num) v = v === "" ? "" : num(v);
    if(e.target.dataset.retag){ const i = +k.split(".")[1], old = dwCur.types[i].tag; v = v.toUpperCase().replace(/[^A-Z0-9]/g,""); e.target.value = v; dwCur.floors.forEach(f=>f.devices.forEach(d=>{ if(d.type===old) d.type = v; })); if(dwTool.type===old) dwTool.type = v; }
    dwSetPath(k, v); dwSchedule(); dwQueue();
  }
  if(e.target.dataset.rooms !== undefined){
    const f = dwCur.floors[+e.target.dataset.rooms];
    const parsed = e.target.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const m = l.match(/^(\S+)\s+(.+)$/); return m ? { no: m[1], name: m[2], floor: f.id } : { no: l, name: "", floor: f.id }; });
    dwCur.rooms = dwCur.rooms.filter(r=>r.floor!==f.id).concat(parsed);
    dwSchedule(); dwQueue();
  }
});

$("#dwEditor").addEventListener("click", async e=>{
  const b = e.target.closest("[data-dact]"); if(!b || !dwCur) return;
  const i = +b.dataset.i, a = b.dataset.dact;
  if(a === "addFloor"){ const n = dwCur.floors.length; dwCur.floors.push({ id: uid(), name: ["Ground","First","Second","Third","Lower ground"][n] || `Floor ${n+1}`, number: `LX-${101+n}`, size: "A1", img: "", iw: 0, ih: 0, fade: .55, devices: [] }); }
  else if(a === "rmFloor"){ if(b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Remove floor and its devices?"; return; } const f = dwCur.floors[i]; dwCur.rooms = dwCur.rooms.filter(r=>r.floor!==f.id); dwCur.floors.splice(i,1); dwFloor = 0; }

  else if(a === "rmType"){ const t = dwCur.types[i]; const used = dwCur.floors.some(f=>f.devices.some(d=>d.type===t.tag)); if(used && b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Devices use this type. Remove them too?"; return; } dwCur.floors.forEach(f=>f.devices = f.devices.filter(d=>d.type!==t.tag)); dwCur.types.splice(i,1); dwOpenTypes.clear(); }

/* ---------- plan upload ---------- */
async function dwUpload(blob, fallbackCanvas){
  const a = await getAssets();
  if(a){ const r = await a.upload(blob); return r.url; }
  const c = document.createElement("canvas"), k = Math.min(1, 1600/fallbackCanvas.width); c.width = fallbackCanvas.width*k; c.height = fallbackCanvas.height*k; c.getContext("2d").drawImage(fallbackCanvas, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", .8);
}
function dwTrim(canvas){
  const ctx = canvas.getContext("2d"), { width: w, height: h } = canvas, d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for(let y=0; y<h; y+=2) for(let x=0; x<w; x+=2){ const o = (y*w+x)*4; if(d[o+3] > 20 && (d[o] < 235 || d[o+1] < 235 || d[o+2] < 235)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1 <= x0 || y1 <= y0) return canvas;
  const pad = Math.round(Math.max(w,h)*.015); x0 = Math.max(0,x0-pad); y0 = Math.max(0,y0-pad); x1 = Math.min(w,x1+pad); y1 = Math.min(h,y1+pad);
  const c = document.createElement("canvas"); c.width = x1-x0; c.height = y1-y0; c.getContext("2d").drawImage(canvas, x0, y0, c.width, c.height, 0, 0, c.width, c.height); return c;
}
async function dwSetPlan(i, canvas){
  dwSetStatus("Uploading plan");
  const blob = await new Promise(r=>canvas.toBlob(r, "image/jpeg", .9));
  try{ const url = await dwUpload(blob, canvas); const f = dwCur.floors[i]; f.img = url; f.iw = canvas.width; f.ih = canvas.height; dwPdf = null; dwFloor = i; dwView = "plan"; dwBuildEditor(); dwRender(); dwSchedule(); toast("Plan added. Pick a device type and click the plan to place it."); }
  catch(err){ dwSetStatus("Plan not added", true); toast(err && err.code === "too_large" ? "That plan is too large to store." : "The plan couldn't be uploaded."); }
}
async function dwHandleFile(i, file){
  if(/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib){ toast("The PDF reader didn't load. Try an image of the plan instead."); return; }
    try{ const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise; dwPdf = { i, doc, n: doc.numPages, page: 1 }; dwBuildEditor(); dwPreviewPdf(); }
    catch(err){ console.error(err); toast("That PDF couldn't be opened."); }
    return;
  }
  try{ const { canvas } = await shrink(file, 3200, "image/jpeg", .9); dwSetPlan(i, $("#dwTrim") && !$("#dwTrim").checked ? canvas : dwTrim(canvas)); }
  catch(err){ toast((err && err.message) || "That image couldn't be read."); }
}
async function dwRenderPdfPage(width){
  const page = await dwPdf.doc.getPage(dwPdf.page), vp1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: width / vp1.width });
  const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise; return c;
}
async function dwPreviewPdf(){ const out = $("#dwPdfCanvas"); if(!out || !dwPdf) return; const c = await dwRenderPdfPage(800); out.width = c.width; out.height = c.height; out.getContext("2d").drawImage(c, 0, 0); }
async function dwUsePdf(){ if(!dwPdf) return; dwSetStatus("Rendering plan"); const c = await dwRenderPdfPage(3200); const trim = $("#dwTrim") ? $("#dwTrim").checked : true; dwSetPlan(dwPdf.i, trim ? dwTrim(c) : c); }

/* ---------- stage: plan editor and sheet preview ---------- */
let dwQT = null; function dwQueue(){ clearTimeout(dwQT); dwQT = setTimeout(dwRender, 160); }

    ${dwView==="plan" ? `
    <select id="dwFloorSel" aria-label="Floor">${p.floors.map((x,i)=>`<option value="${i}" ${i===dwFloor?"selected":""}>${esc(x.name)} floor</option>`).join("")}</select>

}

    <label class="f"><span>Type</span><select class="in" data-dev-k="type">${p.types.map(t=>`<option value="${esc(t.tag)}" ${t.tag===d.type?"selected":""}>${esc(t.tag)} · ${esc(t.name)}</option>`).join("")}</select></label>
    <label class="f"><span>Room</span><select class="in" data-dev-k="room">${p.rooms.map(r=>`<option value="${esc(r.no)}" ${r.no===d.room?"selected":""}>${esc(r.no)} ${esc(r.name)}</option>`).join("")}${p.rooms.some(r=>r.no===d.room)?"":`<option selected value="${esc(d.room)}">${esc(d.room||"None")}</option>`}</select></label>

}
function dwFitSheets(){ const sc = $("#dwScroll"), sh = $("#dwSheets"); if(!sc || !sh) return; sh.style.setProperty("--dz", Math.min(1, Math.max(.2, (sc.clientWidth - 40)/1587)).toFixed(3)); }
new ResizeObserver(()=>{ if(dwView === "doc") dwFitSheets(); }).observe($("#dwScroll"));

$("#dwTools").addEventListener("click", e=>{

$("#dwScroll").addEventListener("input", e=>{
  const k = e.target.dataset.devK; if(!k || !dwCur) return;
  const f = dwCur.floors[dwFloor], d = f.devices.find(x=>x.id===dwSel); if(!d) return;

  d[k] = v; if(k === "mount" && v !== "W") d.height = ""; dwSchedule();
  if(k === "mount") dwRender(); else { const el = $("#dwPlan .mk.sel .t span"); if(el) el.textContent = dwMountStr(d); }
});
$("#dwScroll").addEventListener("click", e=>{
  if(e.target.closest("[data-dact2=delDev]")){ const f = dwCur.floors[dwFloor]; f.devices = f.devices.filter(x=>x.id!==dwSel); dwSel = null; dwSchedule(); dwRender(); }

});

/* ---------- exports ---------- */
function dwFileBase(){ return [dwCur.prefix, dwCur.name, "Drawings Rev " + dwCur.rev].filter(Boolean).join(" ").replace(/[\\/:*?"<>|]+/g,"").trim(); }
$("#dwPdfBtn").addEventListener("click", async ()=>{

$("#dwCsv").addEventListener("click", ()=>{

$("#dwPick").addEventListener("change", async e=>{ if(dwDirty) await dwSave(); dwOpen(e.target.value); });

  const b = e.currentTarget; if(!dwCur) return;

<script>

/* ================= Jobs & scheduler ================= */
const JB_STATUS = [["Enquiry","#5b8fa8"],["To Book","#a08a3c"],["Scheduled","#3f6f9e"],["In Progress","#b8742a"],["On Hold","#857f77"],["To Invoice","#9a3f2f"],["Invoiced, Awaiting Payment","#6e5a90"],["Completed","#4c7a5a"]];
const jbColor = s => (JB_STATUS.find(x=>x[0]===s) || ["", "#6e5a90"])[1];
const jbToday = () => isoDay(new Date(Date.now() - new Date().getTimezoneOffset()*60000));
const jbMins = t => { const m = String(t||"").match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };
const jbHM = m => `${dwPad(Math.floor(m/60))}:${dwPad(m%60)}`;
function jbMonday(d){ const x = new Date(d); x.setHours(12,0,0,0); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
const jbIso = d => { const x = new Date(d); return `${x.getFullYear()}-${dwPad(x.getMonth()+1)}-${dwPad(x.getDate())}`; };
const jbNice = iso => { if(!iso) return ""; const d = new Date(iso + "T12:00:00"); return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); };

let jbLoaded = false, jbList = [], jbCur = null, jbDirty = false, jbSaving = false, jbSaveT = null, jbStarted = false, jbView = "week", jbWeek = jbMonday(new Date()), jbFilter = "active", jbQ = "";
const LSJ = LS + ".jobs";
const jbPendingDel = new Set();
function jbBlank(){
  const max = jbList.reduce((a,j)=>Math.max(a, parseInt(String(j.number||"").replace(/\D/g,""))||0), 0);
  return { id: uid(), number: "JB" + dwPad(max+1, 5), customer: "", clientId: "", email: "", site: "", reference: "", address: "", contact: "", phone: "", status: "Scheduled", description: "", staff: "Ian Lamont", visits: [], time: [], notes: [], materials: [], proposalId: "", clock: null, created: new Date().toISOString().slice(0,16).replace("T"," "), updated: Date.now() };
}
function jbNorm(j){ const o = Object.assign(jbBlank(), j || {}); ["visits","time","notes","materials","files","sheets","invoices"].forEach(k=>o[k] = Array.isArray(o[k]) ? o[k] : []); return o; }
function jbSetStatus(t, warn){ const s = $("#jbStatus"); if(s){ s.textContent = t; s.classList.toggle("warn", !!warn); } }
function jbSchedule(){ jbDirty = true; jbSetStatus("Unsaved"); clearTimeout(jbSaveT); jbSaveT = setTimeout(jbSave, 800); }
async function jbSave(){
  if(!jbCur) return; if(jbSaving){ jbSchedule(); return; }
  jbCur.updated = Date.now(); const snap = clone(jbCur);
  const i = jbList.findIndex(x=>x.id===snap.id); if(i>=0) jbList[i] = snap; else jbList.unshift(snap);
  if(mode === "db"){
    jbSaving = true; jbSetStatus("Saving");
    try{ await db.collection("jobs").doc(snap.id).set({ number: snap.number, customer: snap.customer, status: snap.status, updated: snap.updated, data: snap }); jbDirty = false; jbSetStatus("Saved"); olQueue(snap.id); }
    catch(e){ jbSetStatus("Not saved, retrying", true); setTimeout(jbSave, 4000); }
    jbSaving = false;
  } else { try{ localStorage.setItem(LSJ, JSON.stringify(jbList)); jbSetStatus("Saved on this device"); }catch(e){ jbSetStatus("Not saved", true); } jbDirty = false; olQueue(snap.id); }
  jbRenderList();
}
async function jbStart(){
  if(jbStarted) return; jbStarted = true; jbRenderList(); jbRender();
  if(mode === "db"){
    let first = true;
    db.collection("jobs").orderBy("updated","desc").onSnapshot(snap=>{
      jbList = snap.docs.map(d=>{ const b = d.data() || {}; return jbNorm(Object.assign({}, b.data || {}, { id: d.id, updated: b.updated || 0 })); }).filter(j=>!jbPendingDel.has(j.id));
      if(first){ first = false; jbLoaded = true; jbSetStatus(jbList.length ? "Saved" : "Ready"); }
      if(jbCur){ const r = jbList.find(x=>x.id===jbCur.id); if(r && !jbDirty && !jbSaving && r.updated > jbCur.updated){ jbCur = jbNorm(clone(r)); if(jbView === "job") jbRender(); } }
      jbRenderList(); if(jbView === "week") jbRender();
    }, ()=>jbSetStatus("Offline", true));
  } else {
    try{ jbList = JSON.parse(localStorage.getItem(LSJ) || "[]").map(jbNorm); }catch(e){ jbList = []; } jbLoaded = true;
    jbSetStatus(jbList.length ? "Saved on this device" : "On this device only"); jbRenderList(); jbRender();
  }
}
function jbNext(j){
  const t = jbToday(), vs = j.visits.filter(v=>v.date).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  return vs.find(v=>v.date >= t) || null;
}
function jbLast(j){ const vs = j.visits.filter(v=>v.date).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)); return vs[0] || null; }

/* ---------- list ---------- */
function jbFiltered(){
  const q = jbQ.toLowerCase().split(/\s+/).filter(Boolean);
  return jbList.filter(j=>{
    if(jbFilter === "active" && j.status === "Completed") return false;
    if(jbFilter !== "active" && jbFilter !== "all" && j.status !== jbFilter) return false;
    const hay = [j.number, j.customer, j.site, j.address, j.reference, j.description, j.contact].join(" ").toLowerCase();
    return q.every(t=>hay.includes(t));
  }).sort((a,b)=>{ const na = jbNext(a), nb = jbNext(b); if(na && nb) return (na.date+na.start).localeCompare(nb.date+nb.start); if(na) return -1; if(nb) return 1; return String(b.number).localeCompare(String(a.number)); });
}
function jbRenderList(){
  const box = $("#jbRows"), chips = $("#jbChips"); if(!box) return;

/* Pull every JSON object out of a tool result (structured or text, including back-to-back objects). */
function olObjs(res){
  const out = [], push = v=>{ if(Array.isArray(v)) v.forEach(push); else if(v && typeof v === "object") out.push(v); };
  if(res && res.structuredContent) push(res.structuredContent);
  const txt = ((res && res.content) || []).filter(c=>c && c.type === "text").map(c=>c.text || "").join("\n");
  let i = 0;
  while(i < txt.length){
    const ch = txt[i]; if(ch !== "{" && ch !== "["){ i++; continue; }
    let d = 0, str = false, escp = false, j = i;
    for(; j < txt.length; j++){ const c = txt[j];
      if(str){ if(escp) escp = false; else if(c === "\\") escp = true; else if(c === '"') str = false; continue; }
      if(c === '"') str = true; else if(c === "{" || c === "[") d++; else if(c === "}" || c === "]"){ d--; if(!d) break; } }
    try{ push(JSON.parse(txt.slice(i, j+1))); }catch(_){}
    i = j + 1;
  }
  const flat = []; out.forEach(o=>{ ["events","results","value","items"].forEach(k=>{ if(Array.isArray(o[k])) o[k].forEach(x=>{ if(x && typeof x === "object") flat.push(x); }); }); flat.push(o); });

}
async function olFetch(a, b){

}

function olSpan(ev){ const sd = String(ev.start.dateTime).slice(0,10), ed = String((ev.end && ev.end.dateTime) || ev.start.dateTime).slice(0,10); return { sd, ed, s: jbMins(String(ev.start.dateTime).slice(11,16)) || 0, e: jbMins(String((ev.end && ev.end.dateTime) || "").slice(11,16)) }; }

function olPayload(j, v){
